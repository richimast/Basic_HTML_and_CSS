<!DOCTYPE html>
<html lang="en">

	<head>
		<title>Two main Types of List</title>
		<meta charset="utf-8">
	</head>
	
	<!--Ordered List-->
	<body>
		<ol>
			<li>Bread</li>
			<li>Eggs</li>
			<li>Cheese</li>
			<li>Milk</li>
			<li>Malt</li>
		</ol>
		
	<!--Unordered List-->
		<ul>
			<li>Cats</li>
			<li>Dogs</li>
			<li>Snakes</li>
			<li>Birds</li>
			<li>Elephant</li>
		</ul>
		
	<link rel="stylesheet" type="text/css" href="CSS_Lists.css">
	
	</body>
</html>
